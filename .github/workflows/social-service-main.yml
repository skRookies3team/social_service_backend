name: Build & Deploy Social Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # repo 체크아웃
      - name: Checkout social-service repo
        uses: actions/checkout@v4

      # JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # JAR 빌드 (테스트 제외)
      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      # Docker Hub 로그인
      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Docker 이미지 빌드 & 푸시
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hands7/petlog:social-service-${{ github.sha }}
            hands7/petlog:social-service-latest

      # manifest repo 체크아웃
      - name: Checkout manifest repo
        uses: actions/checkout@v4
        with:
          repository: skRookies3team/manifest_repo
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest

      # values.yaml 이미지 태그 업데이트
      - name: Update image tag in values.yaml
        run: |
          cd manifest/social-service
          sed -i "s|tag:.*|tag: social-service-${{ github.sha }}|" values.yaml

      # 8커밋 & 푸시 (ArgoCD 트리거)
      - name: Commit & Push manifest repo
        run: |
          cd manifest
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "deploy(social-service): social-service-${{ github.sha }}" || echo "no changes"
          git push
